model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.singletask.SingleTaskModel
      init_args:
        encoder:
          - class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
            init_args:
              model_id: OLMOEARTH_V1_BASE
              patch_size: 4

        decoder:
          - class_path: rslearn.models.unet.UNetDecoder
            init_args:
              in_channels: [[4, 768]]
              out_channels: 1
              conv_layers_per_resolution: 2
              num_channels:
                8: 512
                4: 512
                2: 256
                1: 128

          # Collapse spatial dimensions (B,1,H,W) → (B,1)
          - class_path: rslearn.models.component.GlobalAveragePooling

          # Scalar regression head
          - class_path: rslearn.train.tasks.regression.RegressionHead
            init_args:
              loss_mode: mse
              use_sigmoid: false

    optimizer:
      class_path: rslearn.train.optimizer.AdamW
      init_args:
        lr: 0.0001

data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: ./dataset_soiling

    inputs:
      sentinel2_l2a:
        data_type: raster
        layers: ["sentinel2_l2a"]
        bands:
          - B02
          - B03
          - B04
          - B08
          - B05
          - B06
          - B07
          - B8A
          - B11
          - B12
          - B01
          - B09
        passthrough: true
        dtype: FLOAT32
        load_all_layers: true

      targets:
        data_type: vector
        layers: ["label"]
        is_target: true

    task:
      class_path: rslearn.train.tasks.regression.RegressionTask
      init_args:
        property_name: label
        metric_mode: mse
        allow_invalid: false
        scale_factor: 1.0

    batch_size: 8
    num_workers: 32

    default_config:
      groups: ["default"]
      patch_size: 32
      transforms:
        - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
          init_args:
            band_names:
              sentinel2_l2a:
                - B02
                - B03
                - B04
                - B08
                - B05
                - B06
                - B07
                - B8A
                - B11
                - B12
                - B01
                - B09

    train_config:
      tags:
        split: train

    val_config:
      tags:
        split: val

    test_config:
      tags:
        split: val

    predict_config:
      groups: ["predict"]
      load_all_patches: true
      patch_size: 32
      overlap_ratio: 0.1
      skip_targets: true

trainer:
  max_epochs: 100

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ./logs

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: ./checkpoints
        save_top_k: 1
        save_last: true
        monitor: val_mse
        mode: min

    - class_path: rslearn.train.callbacks.freeze_unfreeze.FreezeUnfreeze
      init_args:
        module_selector: ["model", "encoder", 0]
        unfreeze_at_epoch: 10
